title: Spacewalk Documentation
description: Documentation for the Spacewalk 3D visualization application for super-resolution microscopy data
remote_theme: just-the-docs/just-the-docs
show_downloads: true
github:
  repository_url: https://github.com/aidenlab/spacewalk
  is_project_page: true

# NOTE: setting `exclude` replaces Jekyll's defaults, so they are repeated here.
exclude:
  # Agent-facing scaffolding — internal, never published to the docs site
  - agents/
  - adr/
  # Jekyll defaults
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Enable plugins
plugins:
  - jekyll-remote-theme

# Just the Docs specific settings
color_scheme: light
search_enabled: true
heading_anchors: true

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"
