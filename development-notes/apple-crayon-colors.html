
<div style="padding: 2rem 1.5rem; max-width: 520px; margin: 0 auto;">
<style>
.g-label {font-family:var(--font-serif);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-tertiary);margin:0 0 1rem;padding-bottom:.5rem;border-bottom:.5px solid var(--color-border-tertiary);}
.g-grid {display:grid;grid-template-columns:repeat(4,1fr);column-gap:4px;row-gap:20px;margin-bottom:2.75rem;}
.sw {display:flex;flex-direction:column;align-items:center;gap:7px;}
.dot {width:48px;height:48px;border-radius:50%;}
.dn {font-size:10px;color:var(--color-text-tertiary);letter-spacing:.02em;text-align:center;}
</style>
<div id="pal"></div>
<script>
const G=[
  {name:"Neutrals",colors:[["licorice","#000000"],["lead","#1e1e1e"],["tungsten","#3a3a3a"],["iron","#545453"],["steel","#6e6e6e"],["tin","#878687"],["nickel","#888787"],["aluminum","#a09fa0"],["magnesium","#b8b8b8"],["silver","#d0d0d0"],["mercury","#e8e8e8"],["snow","#ffffff"]]},
  {name:"Dark",colors:[["cayenne","#891100"],["mocha","#894800"],["asparagus","#888501"],["fern","#458401"],["clover","#028401"],["moss","#018448"],["teal","#008688"],["ocean","#004a88"],["midnight","#001888"],["eggplant","#491a88"],["plum","#891e88"],["maroon","#891648"]]},
  {name:"Vivid",colors:[["maraschino","#ff2101"],["tangerine","#ff8802"],["lemon","#fffa03"],["lime","#83f902"],["spring","#05f802"],["sea foam","#03f987"],["turquoise","#00fdff"],["aqua","#008cff"],["blueberry","#002eff"],["grape","#8931ff"],["magenta","#ff39ff"],["strawberry","#ff2987"]]},
  {name:"Pastel",colors:[["salmon","#ff726e"],["cantaloupe","#ffce6e"],["banana","#fffb6d"],["honeydew","#cefa6e"],["flora","#68f96e"],["spindrift","#68fbd0"],["ice","#68fdff"],["sky","#6acfff"],["orchid","#6e76ff"],["lavender","#d278ff"],["bubblegum","#ff7aff"],["carnation","#ff7fd3"]]}
];
function lum(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return .299*r+.587*g+.114*b;}
const pal=document.getElementById('pal');
G.forEach(g=>{
  const sec=document.createElement('div');
  const lbl=document.createElement('p');lbl.className='g-label';lbl.textContent=g.name;
  const grid=document.createElement('div');grid.className='g-grid';
  g.colors.forEach(([n,h])=>{
    const sw=document.createElement('div');sw.className='sw';
    const dot=document.createElement('div');dot.className='dot';dot.style.background=h;
    if(lum(h)>185)dot.style.border='.5px solid var(--color-border-tertiary)';
    const dn=document.createElement('span');dn.className='dn';dn.textContent=n;
    sw.append(dot,dn);grid.appendChild(sw);
  });
  sec.append(lbl,grid);pal.appendChild(sec);
});
</script>
</div>
